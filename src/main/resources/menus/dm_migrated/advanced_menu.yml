# Migrated from DeluxeMenus. Review the migration report before using this menu.

Type: CHEST
Title: '&8> &6&lD&eM &bAdvanced Example'
Layout:
- '`dm_slot_0``dm_slot_1``dm_slot_2``dm_slot_3``dm_slot_4``dm_slot_5``dm_slot_6``dm_slot_7``dm_slot_8`'
- '  `dm_slot_11``dm_slot_12`     '
- '         '
Events:
  Open:
  - condition: hasPerm.deluxemenus.admin
    allow:
    - 'sound: BLOCK_BEACON_ACTIVATE'
    - 'tell: &7Opening Advanced example menu, Plugin created by &bextended_clip&7!'
    deny:
    - 'tell: &8[&bDeluxe&eMenus&8] &cYou don''t have perms for this!'
    - return
Buttons:
  dm_slot_11:
    display:
      material:
      - condition: '"%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example'
        allow: LIME_DYE
      - condition: hasPerm.essentials.kits.example && !("%essentials_kit_is_available_example%"
          == "yes" && hasPerm.essentials.kits.example)
        allow: GRAY_DYE
      - condition: true && !("%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example
          || hasPerm.essentials.kits.example)
        allow: GRAY_DYE
      name:
      - condition: '"%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example'
        allow: '&bExample Kit'
      - condition: hasPerm.essentials.kits.example && !("%essentials_kit_is_available_example%"
          == "yes" && hasPerm.essentials.kits.example)
        allow: '&cExample Kit Unavailable'
      - condition: true && !("%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example
          || hasPerm.essentials.kits.example)
        allow: '&7Example Kit'
      lore:
      - condition: '"%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example'
        allow:
        - ''
        - '&7Cooldown : &f3 Days'
        - '&7Left Click to Redeem'
      - condition: hasPerm.essentials.kits.example && !("%essentials_kit_is_available_example%"
          == "yes" && hasPerm.essentials.kits.example)
        allow:
        - '&7This kit is on cooldown!'
        - '&7You must wait : &f%essentials_kit_time_until_available_example%'
        - '&7Before using this kit again.'
      - condition: true && !("%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example
          || hasPerm.essentials.kits.example)
        allow:
        - '&7You do not have permission for this kit!'
      item_flags:
      - condition: '"%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example'
        allow:
        - HIDE_ATTRIBUTES
      - condition: hasPerm.essentials.kits.example && !("%essentials_kit_is_available_example%"
          == "yes" && hasPerm.essentials.kits.example)
        allow:
        - HIDE_ATTRIBUTES
      - condition: true && !("%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example
          || hasPerm.essentials.kits.example)
        allow:
        - HIDE_ATTRIBUTES
    update: 200
    actions:
      left:
      - condition: '"%essentials_kit_is_available_example%" == "yes" && hasPerm.essentials.kits.example'
        allow:
        - 'command: kit example'
        - close
  dm_slot_12:
    display:
      material:
      - condition: hasPerm.deluxemenus.shopexample
        allow: PLAYER_HEAD
      - condition: true && !(hasPerm.deluxemenus.shopexample)
        allow: PLAYER_HEAD
      name:
      - condition: hasPerm.deluxemenus.shopexample
        allow: '&r'
      - condition: true && !(hasPerm.deluxemenus.shopexample)
        allow: '&7No permission'
      lore:
      - condition: hasPerm.deluxemenus.shopexample
        allow:
        - '&7Shop example using'
        - '&7view requirements!'
        - '&fLeft click to purchase.'
      - condition: true && !(hasPerm.deluxemenus.shopexample)
        allow:
        - '&8You are missing the &bdeluxemenus.shopexample'
        - '&8permission which is required to view the item!'
        - '&fLeft click to close the menu.'
      skull_owner:
      - condition: hasPerm.deluxemenus.shopexample
        allow: extended_clip
      - condition: true && !(hasPerm.deluxemenus.shopexample)
        allow: extended_clip
    actions:
      left:
      - condition: hasPerm.deluxemenus.shopexample
        allow:
        - condition: hasMoney.666
          allow:
          - 'sound: ENTITY_FIREWORK_ROCKET_BLAST'
          - 'console: give %player_name% skull 1 player:extended_clip name:&bExtended_Clip
            lore:&8<lore>|&7Example_Shop_Item|&8<lore>'
          - 'tell: &8[&6&lDeluxeShop&8] &fYou have succesfully purchased &7extended_clips
            &fhead!'
          - 'console: eco take %player_name% 666'
          - close
      - condition: true && !(hasPerm.deluxemenus.shopexample)
        allow:
        - 'sound: ENTITY_SNOW_GOLEM_DEATH'
        - close
        - 'tell: &8[&6&lDeluxeShop&8] &fYou have closed the menu! &7(1 Second message
          delay!) <delay=20>'
